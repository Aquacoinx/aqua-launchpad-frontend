 
<script>
let connectedProvider = null;
let connectedWalletName = null;

function getAvailableWallets() {
  const wallets = [];

  const phantom = window.phantom?.solana;
  if (phantom?.isPhantom) {
    wallets.push({ name: "Phantom", provider: phantom });
  }

  const okx = window.okxwallet?.solana;
  if (okx) {
    wallets.push({ name: "OKX Wallet", provider: okx });
  }

  return wallets;
}

async function connectWallet() {
  const btn = document.getElementById("walletBtn");
  const status = document.getElementById("walletStatus");

  if (connectedProvider) {
    await disconnectWallet();
    return;
  }

  const wallets = getAvailableWallets();

  if (wallets.length === 0) {
    status.textContent =
      "No compatible wallet detected. Open Aqua Launchpad inside Phantom or OKX Wallet's browser.";
    alert(
      "No compatible Solana wallet found.\n\n" +
      "Open this website using the browser inside Phantom or OKX Wallet."
    );
    return;
  }

  let selectedWallet;

  if (wallets.length === 1) {
    selectedWallet = wallets[0];
  } else {
    const choice = prompt(
      "Choose your Solana wallet:\n\n" +
      "1. Phantom\n" +
      "2. OKX Wallet\n\n" +
      "Enter 1 or 2:"
    );

    if (choice === "1") {
      selectedWallet = wallets.find(w => w.name === "Phantom");
    } else if (choice === "2") {
      selectedWallet = wallets.find(w => w.name === "OKX Wallet");
    } else {
      return;
    }
  }

  if (!selectedWallet) {
    alert("The selected wallet is not available.");
    return;
  }

  try {
    btn.disabled = true;
    btn.textContent = "Connecting...";

    const response = await selectedWallet.provider.connect();
    const publicKey =
      response?.publicKey || selectedWallet.provider.publicKey;

    if (!publicKey) {
      throw new Error("Wallet did not return a public address.");
    }

    connectedProvider = selectedWallet.provider;
    connectedWalletName = selectedWallet.name;

    const address = publicKey.toString();

    btn.textContent =
      address.slice(0, 4) + "..." + address.slice(-4);

    status.textContent =
      connectedWalletName + " connected: " + address +
      " · Check that your wallet is set to Devnet.";

    connectedProvider.on?.("accountChanged", handleAccountChanged);
    connectedProvider.on?.("disconnect", handleWalletDisconnect);

  } catch (error) {
    connectedProvider = null;
    connectedWalletName = null;

    btn.textContent = "Connect Wallet";
    status.textContent = "Wallet connection was not completed.";

    console.error("Wallet connection error:", error);

    alert(
      error?.message || "Could not connect wallet. Please try again."
    );
  } finally {
    btn.disabled = false;
  }
}

function handleAccountChanged(publicKey) {
  const btn = document.getElementById("walletBtn");
  const status = document.getElementById("walletStatus");

  if (!publicKey) {
    handleWalletDisconnect();
    return;
  }

  const address = publicKey.toString();

  btn.textContent =
    address.slice(0, 4) + "..." + address.slice(-4);

  status.textContent =
    connectedWalletName + " connected: " + address;
}

function handleWalletDisconnect() {
  connectedProvider = null;
  connectedWalletName = null;

  document.getElementById("walletBtn").textContent = "Connect Wallet";
  document.getElementById("walletStatus").textContent =
    "Wallet not connected";
}

async function disconnectWallet() {
  try {
    if (connectedProvider) {
      await connectedProvider.disconnect();
    }
  } catch (error) {
    console.error("Disconnect error:", error);
  }

  handleWalletDisconnect();
}

function demoMessage() {
  alert(
    "Token trading and token detail pages will be connected " +
    "after the on-chain integration is tested."
  );
}

function previewToken() {
  const name = document.getElementById("tokenName").value.trim();
  const symbol = document.getElementById("tokenSymbol")
    .value.trim().toUpperCase();
  const description = document.getElementById("tokenDescription")
    .value.trim();
  const buy = document.getElementById("buyTax").value;
  const sell = document.getElementById("sellTax").value;

  if (!name || !symbol) {
    alert("Please enter a token name and symbol.");
    return;
  }

  alert(
    "TOKEN PREVIEW\n\n" +
    "Name: " + name + "\n" +
    "Symbol: $" + symbol + "\n" +
    "Description: " + (description || "Not provided") + "\n" +
    "Buy tax: " + buy + "%\n" +
    "Sell tax: " + sell + "%\n\n" +
    "This is only a preview. No token has been created on-chain."
  );
}
</script>
